<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Partner Monitor overlay</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/font.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div class="riquadro" id="riquadro">
    <div class="riga-alta">
      <span class="badge-live" id="badge"><span class="punto" aria-hidden="true"></span><span id="badge-testo">OFFLINE</span></span>
      <p class="spettatori"><span id="spettatori">0</span><span class="obiettivo">/ <span id="obiettivo">75</span></span></p>
      <div class="angolo">
        <span class="lurk" id="lurk-blocco" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><strong id="lurk">0</strong></span>
        <div class="comandi">
          <button type="button" id="apri" title="Apri Partner Monitor" aria-label="Apri Partner Monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
          <button type="button" id="chiudi" title="Chiudi l'overlay" aria-label="Chiudi l'overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </div>
    </div>
    <div class="barra"><span id="riempimento"></span></div>
    <div class="riga-bassa" id="periodi"></div>
  </div>
  <script src="js/overlay.js"></script>
</body>
</html>
