appId: com.filippo.partnermonitor
productName: Partner Monitor
copyright: Filippo
directories:
  output: dist
  buildResources: risorse
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
files:
  - package.json
  - main/**/*
  - renderer/**/*
  - risorse/**/*
  - "!**/*.map"
  - "!**/*.md"
  - "!node_modules/**/*"
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*
publish:
  provider: github
  owner: Shadowed1996
  repo: Partner-Monitor-Release
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: risorse/icona.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Partner Monitor
  artifactName: Partner-Monitor-Installazione.exe
  installerLanguages:
    - it_IT
  language: "1040"
  installerIcon: risorse/icona.ico
  uninstallerIcon: risorse/icona.ico
  uninstallDisplayName: Partner Monitor
  deleteAppDataOnUninstall: false
